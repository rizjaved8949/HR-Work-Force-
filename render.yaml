# Render Blueprint — https://render.com/docs/blueprint-spec
#
# Connect the GitHub repo in the Render dashboard (New > Blueprint) and Render
# reads this file. Every setting below is applied automatically except the
# secrets marked `sync: false`, which are typed once in the dashboard.

services:
  - type: web
    name: hr-workforce-intelligence-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      # Secret — set this in the Render dashboard, never in the repo.
      - key: OPENROUTER_API_KEY
        sync: false

      - key: OPENROUTER_MODEL
        value: nvidia/nemotron-3-ultra-550b-a55b:free
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENROUTER_TEMPERATURE
        value: "0"
      - key: OPENROUTER_MAX_TOKENS
        value: "800"
      - key: OPENROUTER_MAX_RETRIES
        value: "1"
      - key: OPENROUTER_TIMEOUT_SECONDS
        value: "45"
      - key: OPENROUTER_REASONING
        value: "off"

      # Existing Supabase project used for graph data, auth, and chat memory.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: USE_AGENT_SUPABASE_MEMORY
        value: "true"
      - key: REQUIRE_AGENT_SUPABASE_MEMORY
        value: "true"

      - key: GRAPH_BACKEND
        value: supabase
      - key: SUPABASE_GRAPH_NODES_TABLE
        value: kg_nodes
      - key: SUPABASE_GRAPH_RELATIONSHIPS_TABLE
        value: kg_relationships

      # Repo-relative paths, resolved against the app root by backend/paths.py.
      - key: DATA_DIR
        value: Data
      - key: MODEL_PATH
        value: models/catboost_attrition_model.cbm

      # Browser origins allowed to call the API. Replace "*" with the real
      # frontend URLs once they exist, e.g. https://your-app.vercel.app
      - key: ALLOWED_ORIGINS
        value: "*"

      - key: SUCCESSOR_LLM_ENABLED
        value: "false"
      - key: SUCCESSOR_OPENROUTER_TIMEOUT_SECONDS
        value: "50"
      - key: SUCCESSOR_OPENROUTER_MAX_TOKENS
        value: "600"
