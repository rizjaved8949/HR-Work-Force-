<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HR UI Integration — Step 11</title>
  <link rel="stylesheet" href="/ui-integration/assets/styles.css" />
</head>
<body>
  <main class="shell">
    <header>
      <div>
        <p class="eyebrow">ROADMAP STEP 11</p>
        <h1>Existing HR Application UI Integration</h1>
        <p class="sub">Live bootstrap, tenant context, permissions, navigation and backend source visibility.</p>
      </div>
      <a class="studio-link" href="/ontology-studio">Ontology Studio</a>
    </header>

    <section id="summary" class="summary-grid"></section>

    <section class="panel">
      <div class="panel-head">
        <div>
          <p class="eyebrow">NAVIGATION CONTRACT</p>
          <h2>Application modules</h2>
        </div>
      </div>
      <div id="nav-grid" class="card-grid"></div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <div>
          <p class="eyebrow">RUNTIME SOURCE</p>
          <h2>Service migration status</h2>
        </div>
      </div>
      <div id="runtime-table" class="table-wrap"></div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <div>
          <p class="eyebrow">FRONTEND HANDOFF</p>
          <h2>Integration contract</h2>
        </div>
      </div>
      <pre id="contract"></pre>
    </section>
  </main>
  <script type="module" src="/ui-integration/assets/console.js"></script>
</body>
</html>
